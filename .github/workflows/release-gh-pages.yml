name: Release to GitHub Pages
on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          # Bazel's version comes from .bazelversion, so there is one place to
          # change it.
          bazelisk-cache: true
          # The action cache and the fetched repositories, kept between runs.
          # Without these every run starts cold: it fetches every apt package,
          # extracts the rootfs twice and compiles graphviz and the TeX
          # formats again. The comment that used to sit here said the
          # directory remapping broke rules_bid; rules_bid is gone.
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: "Build ebook-example"
        run: "cd integration && bazel build //:html_chunked"
      - name: "Build bazel-ebook manual"
        run: "bazel build //:bazel_ebook_html //:bazel_ebook_pdf"
      # The PDF step publishes a directory, and it used to publish all of
      # bazel-bin, excluding only *.d. bazel-bin now holds the Debian rootfs
      # the tools run out of -- twice, once per root module -- and the push
      # failed with "pack exceeds maximum allowed size (2.00 GiB)". Publish a
      # directory that holds the PDF and nothing else.
      - name: "Collect the PDF"
        run: "mkdir -p pages/bazel_ebook_pdf && cp -L bazel-bin/bazel_ebook_pdf.pdf pages/bazel_ebook_pdf/"
      - name: "Examine what will be published"
        run: "ls -l pages/bazel_ebook_pdf ./bazel-bin/bazel_ebook_html.d/bazel_ebook_html ./integration/bazel-bin/html_chunked.d/html_chunked"
      - name: "Deploy ebook-example"
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: filmil/hdlfactory.com.template
          publish_dir: ./integration/bazel-bin/html_chunked.d/html_chunked
          destination_dir: static/html_chunked
          publish_branch: main
          deploy_key: "${{ secrets.DEPLOY_KEY }}"
      - name: "Kill ssh-agent, see: https://github.com/peaceiris/actions-gh-pages/issues/909"
        run: "killall ssh-agent"
      - name: "Deploy bazel_ebook_html"
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: filmil/hdlfactory.com.template
          publish_dir: ./bazel-bin/bazel_ebook_html.d/bazel_ebook_html
          destination_dir: static/bazel_ebook_html
          publish_branch: main
          deploy_key: "${{ secrets.DEPLOY_KEY }}"
      - name: "Kill ssh-agent (2)"
        run: "killall ssh-agent"
      - name: "Deploy bazel_ebook_pdf"
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: filmil/hdlfactory.com.template
          publish_dir: ./pages/bazel_ebook_pdf
          destination_dir: static/bazel_ebook_pdf
          publish_branch: main
          deploy_key: "${{ secrets.DEPLOY_KEY }}"

