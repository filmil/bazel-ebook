name: Build
on:
  # A run on main after every merge, and not only for its own sake: a cache a
  # run writes is readable by later runs on the same ref and on the base
  # branch's descendants, and nothing else. A cache written on a pull request
  # dies with the pull request. Only a run on main writes a cache every pull
  # request can start from.
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "13 7 * * 0"
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          # Bazel's version comes from .bazelversion, so there is one place to
          # change it.
          bazelisk-cache: true
          # The action cache and the fetched repositories, kept between runs.
          # Without these every run starts cold: it fetches every apt package,
          # extracts the rootfs twice and compiles graphviz and the TeX
          # formats again. The comment that used to sit here said the
          # directory remapping broke rules_bid; rules_bid is gone.
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Build error sentinel
        run: bazel build //tests/include-files:html --subcommands
      - name: Build one target
        run: bazel build //tests:neato_png --subcommands
      - name: Build everything
        run: bazel build //...
      # The release workflow runs `bazel test //...` at the tag before it
      # builds the archive, so a test that fails only there fails the release.
      # Running it here fails the pull request instead.
      - name: Test everything
        run: bazel test //...
      - name: Run integration test
        run: cd integration && bazel test //...
